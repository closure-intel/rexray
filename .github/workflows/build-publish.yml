name: Build & Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*.*.*]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER: 0
  PROG: rexray
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Test EBS discovery
      run: go test -race ./libstorage/drivers/storage/ebs/executor ./libstorage/drivers/storage/ebs/utils
      env:
        CGO_ENABLED: 1

  docker-plugin:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_PLUGIN_ROOT: ghcr.io/${{ github.repository }}
      DRIVER: ${{ matrix.driver }}
      GOARCH: amd64
      GOOS: linux
      XGOARCH: amd64
      XGOOS: linux
    strategy:
      fail-fast: false
      matrix:
        driver: [ebs, efs, s3fs]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Set plugin version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        else
          echo "PLUGIN_VERSION=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
        fi
    - name: Build
      run: |
        make
        ./rexray version
    - name: Build Docker Plugin
      run: make build-docker-plugin SEMVER="$PLUGIN_VERSION"
    - name: Verify packaged binary
      run: |
        sudo chroot ".docker/plugins/$DRIVER/rootfs" /usr/bin/rexray version
        docker plugin inspect "$DOCKER_PLUGIN_ROOT/$DRIVER:$PLUGIN_VERSION"
        if [[ "$DRIVER" == ebs ]]; then
          sudo chroot .docker/plugins/ebs/rootfs /usr/sbin/nvme version
        fi
    - name: Log into ghcr.io registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Docker Plugin
      if: github.event_name != 'pull_request'
      run: |
        make push-docker-plugin SEMVER="$PLUGIN_VERSION"
        echo "Plugin: $DOCKER_PLUGIN_ROOT/$DRIVER:$PLUGIN_VERSION" >> "$GITHUB_STEP_SUMMARY"
